<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>伺服器維護中</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      background: #000;
    }

    .background-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 0;
      pointer-events: none; /* 讓背景 iframe 不會阻擋點擊 */
      filter: brightness(0.6) blur(2px); /* 可選：讓背景更柔和 */
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #0ff;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 8px #0ff, 0 0 16px #0ff;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
      margin-top: 1rem;
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 12px 24px;
      font-size: 1.2rem;
      color: #0ff;
      background: #111;
      border: 2px solid #0ff;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 0 12px #0ff;
      transition: 0.3s ease;
    }

    a:hover {
      background: #0ff;
      color: #000;
      box-shadow: 0 0 18px #0ff, 0 0 36px #0ff;
    }
  </style>
</head>
<body>
  <!-- 背景iframe -->
  <iframe class="background-iframe" src="https://www.enenlive.com/bg.html" frameborder="0"></iframe>

  <!-- 內容 -->
  <div class="content">
    <h1>⚠️ 伺服器維護中 ⚠️</h1>
    <p>目前系統暫時關閉，將於稍後恢復。如有問題請私訊 IG</p>
    <a href="https://www.instagram.com/enen._.1216/" target="_blank">🔗 前往 Instagram</a>
  </div>
</body>
</html>
