<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動態藍色背景示範</title>
  <style>
    /* 全螢幕背景區域 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* 動態背景容器 */
    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #001F3F; /* 深藍色背景 */
      z-index: -1; /* 確保背景不會覆蓋內容 */
    }

    .content {
      position: relative;
      z-index: 1; /* 確保內容顯示在背景之上 */
      color: #e0e0e0;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 動態背景容器 -->
  <div id="particles-js"></div>
  <!-- 引入 Particles.js 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    /* Particles.js 配置 */
    particlesJS('particles-js', {
      particles: {
        number: {
          value: 100,
          density: {
            enable: true,
            value_area: 800
          }
        },
        color: {
          value: "#66B2FF"  /* 粉藍色粒子 */
        },
        shape: {
          type: "circle",
          stroke: {
            width: 0,
            color: "#000000"
          },
          polygon: {
            nb_sides: 5
          }
        },
        opacity: {
          value: 0.7, /* 增加粒子透明度 */
          random: false,
          anim: {
            enable: false,
            speed: 1,
            opacity_min: 0.1,
            sync: false
          }
        },
        size: {
          value: 4, /* 粒子大小 */
          random: true,
          anim: {
            enable: false,
            speed: 40,
            size_min: 0.1,
            sync: false
          }
        },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#66B2FF", /* 粉藍色線條 */
          opacity: 0.9, /* 增加線條不透明度 */
          width: 2.5, /* 增加線條寬度 */
          opacity: 0.7,
          direction: 'none',  /* 使線條的連接方向無限制 */
        },
        move: {
          enable: true,
          speed: 3, /* 減緩移動速度，使線條更加穩定 */
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out",
          bounce: false,
          attract: {
            enable: false,
            rotateX: 600,
            rotateY: 1200
          }
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: {
            enable: true,
            mode: "repulse"
          },
          onclick: {
            enable: true,
            mode: "push"
          },
          resize: true
        },
        modes: {
          grab: {
            distance: 400,
            line_linked: {
              opacity: 1
            }
          },
          bubble: {
            distance: 400,
            size: 40,
            duration: 2,
            opacity: 8,
            speed: 3
          },
          repulse: {
            distance: 200,
            duration: 0.4
          },
          push: {
            particles_nb: 4
          },
          remove: {
            particles_nb: 2
          }
        }
      },
      retina_detect: true
    });

    // 禁止右鍵選單
    document.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });

    // 防止拖拉圖片
    document.addEventListener("dragstart", function (e) {
        e.preventDefault();
    });


    document.addEventListener("keydown", function (e) {
        if (
          e.key === "F12" || // 禁止 F12
          e.ctrlKey && (e.key === "s" || e.key === "S" || e.keyCode === 83)) {  // 禁止 Ctrl+S
            e.preventDefault(); 
            return false; 
        }
        if (e.ctrlKey && (e.key === "u" || e.key === "U" || e.keyCode === 85)) { // 禁止 Ctrl+U
            e.preventDefault(); 
            return false; 
        }
    });
  </script>
</body>
</html>
